name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # ARM hosted-runner availability can depend on GitHub plan/repository eligibility.
    # If unavailable, CI must report that as an infrastructure limitation, not a code failure.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x86_64
          - runner: ubuntu-24.04-arm
            label: arm64
    runs-on: ${{ matrix.runner }}
    name: build-test-${{ matrix.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Capture build environment
        run: ./build/kernex_envprobe | tee environment.json
      - name: Upload environment report
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ matrix.label }}
          path: environment.json
          if-no-files-found: error

  sanitizers:
    name: asan-ubsan-stress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure --no-tests=error --parallel 2
