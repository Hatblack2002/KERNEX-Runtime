name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # ARM hosted-runner availability can depend on GitHub plan/repository eligibility.
    # If unavailable, CI must report that as an infrastructure limitation, not a code failure.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x86_64
          - runner: ubuntu-24.04-arm
            label: arm64
    runs-on: ${{ matrix.runner }}
    name: build-test-${{ matrix.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Capture build environment
        run: ./build/kernex_envprobe | tee environment.json
      - name: Upload environment report
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ matrix.label }}
          path: environment.json
          if-no-files-found: error