plugins { id 'com.android.application' }

android {
    namespace 'com.kernex.runtime'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kernex.runtime'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' }
        }
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
